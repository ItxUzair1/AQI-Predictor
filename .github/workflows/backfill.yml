name: AQI Backfill (One-Time)

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of past days to backfill'
        required: false
        default: '30'

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "hopsworks[python]"
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Backfill
      env:
        AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
        HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
      run: python scripts/backfill_data.py --days ${{ github.event.inputs.days || 30 }}
